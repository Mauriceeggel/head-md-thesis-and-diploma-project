<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HEAD — Media Design</title>
  <meta name="description" content="Archive de recherches, inspirations, idées et prototypes liés à ma thèse et à mon projet de diplôme du Master Media Design.">

  <!-- Feuille de style de la page d'accueil.
       Cette page remplace le README.md sur GitHub Pages : quand un index.html
       existe à la racine, c'est lui qui est affiché à la place du markdown.
       Le README.md reste visible sur la page du repository GitHub. -->
  <!-- "?v=1" : numéro de version, à augmenter quand tu modifies style.css
       pour forcer les navigateurs à recharger la nouvelle version. -->
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>

  <!-- =========================================================
       ÉCRAN DE DÉMARRAGE
       Recouvre le bureau à l'arrivée sur le site (voir js/boot.js).
       1. On clique sur le bouton d'allumage : les navigateurs bloquent
          le son tant que le visiteur n'a pas cliqué sur la page.
       2. Le son de démarrage se joue et la barre se remplit au même
          rythme.
       3. À l'entrée du piano (FADE_START dans js/boot.js), l'écran
          disparaît en fondu ; le son continue de jouer.

       POUR UTILISER TA PROPRE IMAGE DE BOUTON : remplacer le <svg>…</svg>
       ci-dessous par
         <img src="img/boot-button.png" alt="">
       (le PNG est automatiquement mis à la taille du bouton, voir
       .boot-power dans css/style.css).
       ========================================================= -->
  <div class="boot" role="dialog" aria-label="Startup">
    <button class="boot-power" type="button" aria-label="Start">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v9"/>
        <path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
      </svg>
    </button>
    <p class="boot-hint">click to start</p>
    <div class="boot-bar" aria-hidden="true"><div class="boot-progress"></div></div>
    <audio class="boot-sound" src="audio/startup-sound.mp3" preload="auto"></audio>
  </div>

  <!-- =========================================================
       BUREAU
       Chaque <a class="folder"> est une icône de dossier, comme sur le
       bureau d'un ordinateur. Pour ajouter un dossier : copier un bloc
       <a>…</a>, changer le href (le chemin du dossier) et le nom.
       ========================================================= -->
  <main class="desktop">

    <!-- Ouvre le bloc-notes (process/notes.html), version mise en page
         de process/readme.md. -->
    <a class="folder" href="process/notes.html" data-window="Process — Bloc-notes">
      <svg class="folder-icon" viewBox="0 0 64 52" aria-hidden="true">
        <!-- onglet + dos du dossier -->
        <path class="folder-back" d="M2 6a4 4 0 0 1 4-4h16l6 6h30a4 4 0 0 1 4 4v34a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/>
        <!-- face avant du dossier -->
        <path class="folder-front" d="M2 16a4 4 0 0 1 4-4h52a4 4 0 0 1 4 4v30a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/>
      </svg>
      <span class="folder-name">ᴘʀᴏᴄᴇꜱꜱ</span>
    </a>

    <!-- data-window : ce dossier s'ouvre dans une fenêtre sur le bureau
         (voir js/desktop.js) au lieu de quitter la page. La valeur est le
         titre affiché dans la barre de la fenêtre. Sans cet attribut, le
         dossier reste un simple lien. -->
    <!-- Icône d'application (image) au lieu d'une icône de dossier -->
    <a class="folder" href="web-entities-reworked/" data-window="web-entities.exe">
      <img class="folder-icon app-icon" src="img/web-entities-logo.png" alt="" aria-hidden="true">
      <span class="folder-name">web&#8209;entities.exe</span><!-- &#8209; = tiret insécable, pour que le nom ne soit pas coupé -->
    </a>

  </main>

  <!-- Gère l'ouverture des dossiers en fenêtres (déplacer, redimensionner,
       agrandir, plein écran, réduire, fermer). -->
  <script src="js/desktop.js?v=1"></script>

  <!-- Écran de démarrage + son -->
  <script src="js/boot.js?v=5"></script>

</body>
</html>
